# ######## Window rules ########

# 窗口浮动和平铺
windowrule = match:class .*, float 1

# 窗口全屏
windowrule = match:class (swayimg|vlc|plantsvszombiesrh\.exe), fullscreen 1

# 窗口置顶
windowrule = match:class (showmethekey\-gtk|python3), pin 1

# 全局窗口属性
windowrule = match:fullscreen 0, opacity $windowOpacity override 
windowrule = match:class (foot|equibop|swappy|org\.shotcut\.Shotcut|org\.quickshell|kitty), opaque 1   # 使用原始透明度
windowrule = match:float 1, match:xwayland 0, center 1   # 除了xwayland的浮动窗口全部居中

# xwayland弹出窗口
windowrule = match:xwayland 1, match:title win[0-9]+, no_dim 1
windowrule = match:xwayland 1, match:title win[0-9]+, no_shadow 1
windowrule = match:xwayland 1, match:title win[0-9]+, rounding 10

# 工作区规则
workspace = w[tv1]s[false], gapsout:$singleWindowGapsOut
workspace = f[1]s[false], gapsout:$singleWindowGapsOut

# 层规则
layerrule = animation fade, match:namespace hyprpicker  # 颜色选择器退出动画
layerrule = animation fade, match:namespace logout_dialog  # wlogout淡入淡出
layerrule = animation fade, match:namespace selection  # slurp区域选择器淡入淡出
layerrule = animation fade, match:namespace wayfreeze  # wayfreeze屏幕冻结提示淡入淡出
# Fuzzel
layerrule = animation popin 80%, match:namespace launcher
layerrule = blur on, match:namespace launcher
# Shell
layerrule = no_anim on, match:namespace caelestia-(border-exclusion|area-picker)  # 关闭动画
layerrule = animation fade, match:namespace caelestia-(drawers|background)  # 开启动画
layerrule = blur on, match:namespace caelestia-drawers  # 开启模糊
layerrule = ignore_alpha 0.57, match:namespace caelestia-drawers  # 忽略透明度低于0.58的像素

# 浮动，大小和位置
windowrule = match:class foot, match:title nmtui, size 60% 70%
windowrule = match:class foot, match:title nmtui, center 1
windowrule = match:class org\.gnome\.Settings, size 70% 80%
windowrule = match:class org\.gnome\.Settings, center 1
windowrule = match:class (org\.pulseaudio\.pavucontrol|yad-icon-browser), size 60% 70%
windowrule = match:class (org\.pulseaudio\.pavucontrol|yad-icon-browser), center 1
windowrule = match:class nwg-look, size 50% 60%
windowrule = match:class nwg-look, center 1

# 画中画的位置和大小
windowrule = match:title Picture(-| )in(-| )[Pp]icture, move 100%-w-2% 100%-w-3%  # Initial move so window doesn't shoot across the screen from the center
windowrule = match:title Picture(-| )in(-| )[Pp]icture, keep_aspect_ratio 1
windowrule = match:title Picture(-| )in(-| )[Pp]icture, pin 1

# 自动移到特殊工作区的程序
windowrule = match:class (wechat|QQ|org\.telegram\.desktop), workspace special:communication
windowrule = match:class Todoist, workspace special:todo

# 对话框
windowrule = match:title (Select|Open)( a)? (File|Folder)(s)?, float 1
windowrule = match:title File (Operation|Upload)( Progress)?, float 1
windowrule = match:title .* Properties, float 1
windowrule = match:title Export Image as PNG, float 1
windowrule = match:title GIMP Crash Debug, float 1
windowrule = match:title Save As, float 1
windowrule = match:title Library, float 1

# 软件配置
# lutris
windowrule = match:class net\.lutris\.Lutris, match:title Lutris, tile 1

# wine
windowrule = match:class \.exe$, no_blur 1
windowrule = match:class explorer\.exe, move 1730 1036
# waylyrics
windowrule = match:class io\.github\.waylyrics\.Waylyrics, size 503 126
windowrule = match:class io\.github\.waylyrics\.Waylyrics, move 720 33
windowrule = match:class io\.github\.waylyrics\.Waylyrics, border_size 1
windowrule = match:class io\.github\.waylyrics\.Waylyrics, no_blur 1
windowrule = match:class io\.github\.waylyrics\.Waylyrics, no_shadow 1
windowrule = match:class io\.github\.waylyrics\.Waylyrics, pin 1
# launcherx
windowrule = match:class LauncherX\.Avalonia, center 1
# obsidian
windowrule = match:class obsidian, size 1280 960
# vmware
windowrule = match:class Vmware, match:title .*VMware\sWorkstation, tile 1
# mpv
windowrule = match:class mpv, match:title .*mpv$, fullscreen 1
# kitty
windowrule = match:class kitty, tile 1
# feh
windowrule = match:class feh, no_anim 1
windowrule = match:class feh, fullscreen 1
# Vmware-workstation
windowrule = match:class Vmware, match:title (Home.*|Windows.*), size 1280 960
# GoldenDict-ng
windowrule = match:class GoldenDict-ng, match:title .*\s-\sGoldenDict-ng, stay_focused 1  # 保持窗口焦点
windowrule = match:class GoldenDict-ng, move 1296 45
# Steam
windowrule = match:title (), match:class steam, rounding 10
windowrule = match:class steam_app_default, center 1
windowrule = match:class steam_app_[0-9]+, immediate 1  # 关闭垂直同步
windowrule = match:class steam_app_[0-9]+, idle_inhibit always  # 禁止进入空闲状态
windowrule = match:class steam_app_431960, move 87 34
windowrule = match:class steam_app_431960, match:title Wallpaper\sUI, center 1
# zen-browser
windowrule = match:class zen, match:title Zen\sBrowser, tile 1
# chromium
windowrule = match:class chromium, tile 1
# firefox
windowrule = match:class firefox, match:title negative:\(我的足迹.*\), tile 1
# 微信
windowrule = match:class wechat, match:title wechat, border_size 0
windowrule = match:class wechat, match:title (wechat|Open), match:float 1, no_anim 1
windowrule = match:class wechat, match:title 预览, fullscreen 1
windowrule = match:class wechat, match:title 预览, match:float 1, focus_on_activate 1  # 自动获取窗口焦点
# 让我看键/show me the key
windowrule = match:class showmethekey\-gtk, size 500 60
windowrule = match:class showmethekey\-gtk, move 100%-527 100%-87
windowrule = match:class showmethekey\-gtk, border_size 0
windowrule = match:class showmethekey\-gtk, no_focus 1
# 音量控制/pavucontrol
windowrule = match:title 音量控制, size 550 1000
# kitty浮动
windowrule = match:title ^(kitty_float)$, float 1
windowrule = match:title ^(kitty_float)$, size 1200 1000
windowrule = match:class kitty, match:title termfilechooser, float 1
# bitwarden
windowrule = match:title Bitwarden, match:class Bitwarden, size 955 972
