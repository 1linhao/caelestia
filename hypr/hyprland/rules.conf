# ######## Window rules ########

# 窗口浮动和平铺
windowrulev2 = float, class:.*

# 窗口全屏
windowrulev2 = fullscreen, class:(swayimg|vlc|plantsvszombiesrh\.exe)

# 窗口置顶
windowrulev2 = pin, class:(showmethekey\-gtk|python3)

# 全局窗口属性
windowrulev2 = opacity $windowOpacity override, fullscreen:0
windowrulev2 = opaque, class:(foot|equibop|swappy|org\.shotcut\.Shotcut|org\.quickshell|kitty)  # 使用原始透明度
windowrulev2 = center, floating:1, xwayland:0  # 除了xwayland的浮动窗口全部居中

# xwayland弹出窗口
windowrulev2 = no_dim, xwayland:1, title:win[0-9]+
windowrulev2 = no_shadow, xwayland:1, title:win[0-9]+
windowrulev2 = rounding 10, xwayland:1, title:win[0-9]+

# 工作区规则
workspace = w[tv1]s[false], gapsout:$singleWindowGapsOut
workspace = f[1]s[false], gapsout:$singleWindowGapsOut

# 层规则
layerrule = animation fade, match:namespace hyprpicker  # 颜色选择器退出动画
layerrule = animation fade, match:namespace logout_dialog  # wlogout淡入淡出
layerrule = animation fade, match:namespace selection  # slurp区域选择器淡入淡出
layerrule = animation fade, match:namespace wayfreeze  # wayfreeze屏幕冻结提示淡入淡出
# Fuzzel
layerrule = animation popin 80%, match:namespace launcher
layerrule = blur on, match:namespace launcher
# Shell
layerrule = no_anim on, match:namespace caelestia-(border-exclusion|area-picker)  # 关闭动画
layerrule = animation fade, match:namespace caelestia-(drawers|background)  # 开启动画
layerrule = blur on, match:namespace caelestia-drawers  # 开启模糊
layerrule = ignore_alpha 0.57, match:namespace caelestia-drawers  # 忽略透明度低于0.58的像素

# 浮动，大小和位置
windowrulev2 = size 60% 70%, class:foot, title:nmtui
windowrulev2 = center, class:foot, title:nmtui
windowrulev2 = size 70% 80%, class:org\.gnome\.Settings
windowrulev2 = center, class:org\.gnome\.Settings
windowrulev2 = size 60% 70%, class:(org\.pulseaudio\.pavucontrol|yad-icon-browser)
windowrulev2 = center, class:(org\.pulseaudio\.pavucontrol|yad-icon-browser)
windowrulev2 = size 50% 60%, class:nwg-look
windowrulev2 = center, class:nwg-look

# 画中画的位置和大小
windowrulev2 = move 100%-w-2% 100%-w-3%, title:Picture(-| )in(-| )[Pp]icture  # Initial move so window doesn't shoot across the screen from the center
windowrulev2 = keep_aspect_ratio, title:Picture(-| )in(-| )[Pp]icture
windowrulev2 = pin, title:Picture(-| )in(-| )[Pp]icture

# 自动移到特殊工作区的程序
windowrulev2 = workspace special:communication, class:(wechat|QQ|org\.telegram\.desktop)
windowrulev2 = workspace special:todo, class:Todoist

# 对话框
windowrulev2 = float, title:(Select|Open)( a)? (File|Folder)(s)?
windowrulev2 = float, title:File (Operation|Upload)( Progress)?
windowrulev2 = float, title:.* Properties
windowrulev2 = float, title:Export Image as PNG
windowrulev2 = float, title:GIMP Crash Debug
windowrulev2 = float, title:Save As
windowrulev2 = float, title:Library

# 软件配置
# lutris
windowrulev2 = tile, class:net\.lutris\.Lutris, title:Lutris

# wine
windowrulev2 = no_blur, class:\.exe$
windowrulev2 = move 1730 1036, class:explorer\.exe
# waylyrics
windowrulev2 = size 503 126, class:io\.github\.waylyrics\.Waylyrics
windowrulev2 = move 720 33, class:io\.github\.waylyrics\.Waylyrics
windowrulev2 = no_border, class:io\.github\.waylyrics\.Waylyrics
windowrulev2 = no_blur, class:io\.github\.waylyrics\.Waylyrics
windowrulev2 = no_shadow, class:io\.github\.waylyrics\.Waylyrics
windowrulev2 = pin, class:io\.github\.waylyrics\.Waylyrics
# launcherx
windowrulev2 = center, class:LauncherX\.Avalonia
# obsidian
windowrulev2 = size 1280 960, class:obsidian
# vmware
windowrulev2 = tile, class:Vmware, title:.*VMware\sWorkstation
# mpv
windowrulev2 = fullscreen, class:mpv, title:.*mpv$
# kitty
windowrulev2 = tile, class:kitty
# feh
windowrulev2 = no_anim, class:feh
windowrulev2 = fullscreen, class:feh
# Vmware-workstation
windowrulev2 = size 1280 960, class:Vmware, title:(Home.*|Windows.*)
# GoldenDict-ng
windowrulev2 = stay_focused, class:GoldenDict-ng, title:.*\s-\sGoldenDict-ng  # 保持窗口焦点
windowrulev2 = move 1296 45, class:GoldenDict-ng
# Steam
windowrulev2 = rounding 10, title:, class:steam
windowrulev2 = center, class:steam_app_default
windowrulev2 = immediate, class:steam_app_[0-9]+  # 关闭垂直同步
windowrulev2 = idle_inhibit always, class:steam_app_[0-9]+  # 禁止进入空闲状态
windowrulev2 = move 87 34, class:steam_app_431960
windowrulev2 = center, class:steam_app_431960, title:Wallpaper\sUI
# zen-browser
windowrulev2 = tile, class:zen, title:Zen\sBrowser
# firefox
windowrulev2 = tile, class:firefox, title:negative:\(我的足迹.*\)
# 微信
windowrulev2 = no_border, class:wechat, title:wechat
windowrulev2 = no_anim, class:wechat, title:(wechat|Open), floating:1
windowrulev2 = fullscreen, class:wechat, title:预览
windowrulev2 = focus_on_activate, class:wechat, title:预览, floating:1  # 自动获取窗口焦点
# 让我看键/show me the key
windowrulev2 = size 500 60, class:showmethekey\-gtk
windowrulev2 = move 100%-527 100%-87, class:showmethekey\-gtk
windowrulev2 = no_border, class:showmethekey\-gtk
windowrulev2 = no_focus, class:showmethekey\-gtk
# 音量控制/pavucontrol
windowrulev2 = size 550 1000, title:音量控制
# kitty浮动
windowrulev2 = float, title:^(kitty_float)$
windowrulev2 = size 1200 1000, title:^(kitty_float)$
windowrulev2 = float, class:kitty, title:termfilechooser
# bitwarden
windowrulev2 = size 955 972, title:Bitwarden, class:Bitwarden
